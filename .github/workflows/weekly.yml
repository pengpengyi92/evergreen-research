name: weekly-research

on:
  schedule:
    - cron: "30 2 * * 1"   # every Monday 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run weekly sweep + audit + snapshot
        run: |
          python -m presearch.cli weekly
          python -m presearch.cli audit
          python -m presearch.cli snapshot
          python -m presearch.cli rss
          python -m presearch.cli groups || echo "[groups] rate-limited this week; cached data kept"
      - name: Commit and push research updates
        run: |
          git config user.name "presearch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(weekly): frontier AI research sweep $(date +%F)"
            git push
          fi
