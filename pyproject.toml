[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "p-research"
version = "0.1.0"
description = "P-Research: a self-updating, continuously running frontier-AI research intelligence. Weekly arXiv sweeps, a living paper database, cross-pillar signal clustering, and a growing survey."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pengyi Research" }]
keywords = ["arxiv", "deep-research", "frontier-ai", "survey", "research-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
presearch = "presearch.cli:main"

[tool.setuptools]
packages = ["presearch"]
